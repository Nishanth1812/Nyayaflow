[project]
name = "nyayaflow"
version = "0.1.0"
description = "NyayaFlow — Explainable, Deterministic Public Grievance & Appeal Platform"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "fastapi==0.121.3",
    "pydantic==2.10.6",
    "SQLAlchemy==2.0.38",
    "uvicorn[standard]==0.38.0",
    "httpx==0.27.2",
    "pytest==9.0.2",
    "python-dotenv==1.2.3",
]

[project.scripts]
nyayaflow = "backend.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "httpx==0.27.2",
]

[tool.uv]
managed = true
